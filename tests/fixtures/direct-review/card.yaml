prompt: ok so I need to write a review for the dryer I bought for the van, the Tumblewind Gale 2. Going
  on the PawSupply page. It's not a bad dryer it's just a LOT. Can you write it up? notes below
notes_pack:
  facts:
  - paid 389 CAD at PawSupply in March, came with 3 nozzles
  - two speeds, high is very loud, a customer's husky howled along with it
  - hose is 2.4 m, long enough to reach round the van table
  - the 'quiet mode' button is just the low setting
  anecdotes:
  - first week a pomeranian came out looking like a dandelion clock
  - it tripped the van inverter twice until I swapped to a 2000W one
  opinions:
  - dries a doodle in about 20 min, fastest I've used
  - 4 stars, would buy again, buy ear defenders too
  wants:
  - funny but actually useful for other mobile groomers
